<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d64545"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f9e5a"/>
    </marker>
    <style>
      .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
      .chip-text { font-size: 12px; text-anchor: middle; dominant-baseline: central; }
      .on-red rect { fill: #fdecec; stroke: #d64545; }
      .on-red text { fill: #9b2c2c; }
      .on-green rect { fill: #e8f6ee; stroke: #2f9e5a; }
      .on-green text { fill: #1f6b3d; font-weight: 600; }
      .off rect { fill: #ffffff; stroke: #d1d5db; stroke-dasharray: 4 3; }
      .off text { fill: #b6bcc6; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">babel-plugin-react-native-direct-imports</text>

  <!-- Source code -->
  <rect x="230" y="72" width="740" height="56" rx="10" fill="#1f2937"/>
  <text x="600" y="100" text-anchor="middle" dominant-baseline="central" class="mono" font-size="17">
    <tspan fill="#c792ea">import</tspan><tspan fill="#e5e7eb"> { View, AppRegistry, Systrace } </tspan><tspan fill="#c792ea">from</tspan><tspan fill="#c3e88d"> 'react-native'</tspan><tspan fill="#e5e7eb">;</tspan>
  </text>

  <!-- Branch arrows -->
  <path d="M520,128 C520,160 310,150 310,180" fill="none" stroke="#d64545" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <path d="M680,128 C680,160 890,150 890,180" fill="none" stroke="#2f9e5a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Column backgrounds -->
  <rect x="30" y="186" width="560" height="530" rx="14" fill="#fffafa" stroke="#f3c4c4"/>
  <rect x="610" y="186" width="560" height="530" rx="14" fill="#f8fdfa" stroke="#bfe5cd"/>

  <text x="310" y="218" text-anchor="middle" font-size="19" font-weight="700" fill="#d64545">✕  Without the plugin</text>
  <text x="890" y="218" text-anchor="middle" font-size="19" font-weight="700" fill="#2f9e5a">✓  With the plugin</text>

  <!-- LEFT: barrel -->
  <rect x="70" y="240" width="480" height="78" rx="10" fill="#ffffff" stroke="#d64545" stroke-width="1.5"/>
  <text x="310" y="268" text-anchor="middle" class="mono" font-size="16" font-weight="600" fill="#111827">react-native/index.js</text>
  <text x="310" y="294" text-anchor="middle" font-size="13.5" fill="#4b5563">CommonJS barrel · a lazy require() getter for every API</text>

  <text x="310" y="358" text-anchor="middle" font-size="14" fill="#6b7280" font-style="italic">bundler can't tree-shake a CommonJS barrel…</text>
  <!-- fan of arrows -->
  <g stroke="#d64545" stroke-width="1.6" fill="none" opacity="0.75">
    <path d="M310,318 L310,340"/>
    <path d="M140,372 L140,420" marker-end="url(#arrowRed)"/>
    <path d="M250,372 L250,420" marker-end="url(#arrowRed)"/>
    <path d="M370,372 L370,420" marker-end="url(#arrowRed)"/>
    <path d="M480,372 L480,420" marker-end="url(#arrowRed)"/>
  </g>

  <!-- RIGHT: plugin + map -->
  <rect x="650" y="240" width="480" height="78" rx="10" fill="#ffffff" stroke="#2f9e5a" stroke-width="1.5"/>
  <text x="890" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Babel plugin  +  <tspan class="mono" font-weight="600">maps/&lt;rn-version&gt;.json</tspan></text>
  <text x="890" y="294" text-anchor="middle" font-size="13.5" fill="#4b5563">looks up each imported name → its real file inside react-native</text>

  <path d="M890,318 L890,336" stroke="#2f9e5a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="630" y="342" width="520" height="80" rx="8" fill="#1f2937"/>
  <g class="mono" font-size="11.2" fill="#e5e7eb">
    <text x="644" y="363"><tspan fill="#c792ea">const</tspan> View = require(<tspan fill="#c3e88d">'…/Components/View/View'</tspan>).default;</text>
    <text x="644" y="384"><tspan fill="#c792ea">const</tspan> AppRegistry = require(<tspan fill="#c3e88d">'…/ReactNative/AppRegistry'</tspan>).AppRegistry;</text>
    <text x="644" y="405"><tspan fill="#c792ea">const</tspan> Systrace = require(<tspan fill="#c3e88d">'…/Performance/Systrace'</tspan>);</text>
  </g>

  <path d="M890,422 L890,436" stroke="#2f9e5a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- LEFT grid: everything bundled -->
  <g class="on-red">
    <g transform="translate(55,440)">
      <g><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">View</text></g>
      <g transform="translate(132,0)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">Text</text></g>
      <g transform="translate(264,0)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">Image</text></g>
      <g transform="translate(396,0)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">ScrollView</text></g>

      <g transform="translate(0,44)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">FlatList</text></g>
      <g transform="translate(132,44)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">AppRegistry</text></g>
      <g transform="translate(264,44)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">Animated</text></g>
      <g transform="translate(396,44)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">Modal</text></g>

      <g transform="translate(0,88)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">Alert</text></g>
      <g transform="translate(132,88)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">Linking</text></g>
      <g transform="translate(264,88)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">Systrace</text></g>
      <g transform="translate(396,88)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">Keyboard</text></g>

      <g transform="translate(0,132)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">VirtualView</text></g>
      <g transform="translate(132,132)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">PushNotificationIOS</text></g>
      <g transform="translate(264,132)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">ActionSheetIOS</text></g>
      <g transform="translate(396,132)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">… and the rest</text></g>
    </g>
  </g>

  <!-- RIGHT grid: only used modules bundled -->
  <g transform="translate(635,440)">
    <g class="on-green"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">View</text></g>
    <g class="off" transform="translate(132,0)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">Text</text></g>
    <g class="off" transform="translate(264,0)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">Image</text></g>
    <g class="off" transform="translate(396,0)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">ScrollView</text></g>

    <g class="off" transform="translate(0,44)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">FlatList</text></g>
    <g class="on-green" transform="translate(132,44)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">AppRegistry</text></g>
    <g class="off" transform="translate(264,44)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">Animated</text></g>
    <g class="off" transform="translate(396,44)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">Modal</text></g>

    <g class="off" transform="translate(0,88)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">Alert</text></g>
    <g class="off" transform="translate(132,88)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">Linking</text></g>
    <g class="on-green" transform="translate(264,88)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">Systrace</text></g>
    <g class="off" transform="translate(396,88)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">Keyboard</text></g>

    <g class="off" transform="translate(0,132)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">VirtualView</text></g>
    <g class="off" transform="translate(132,132)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">PushNotificationIOS</text></g>
    <g class="off" transform="translate(264,132)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">ActionSheetIOS</text></g>
    <g class="off" transform="translate(396,132)"><rect width="122" height="34" rx="7"/><text x="61" y="17" class="chip-text">… and the rest</text></g>
  </g>

  <!-- Results -->
  <rect x="70" y="636" width="480" height="56" rx="10" fill="#d64545"/>
  <text x="310" y="658" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">All of React Native is in the bundle</text>
  <text x="310" y="679" text-anchor="middle" font-size="13" fill="#fde2e2">even though you used only 3 APIs</text>

  <rect x="650" y="636" width="480" height="56" rx="10" fill="#2f9e5a"/>
  <text x="890" y="658" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Only what you import is in the bundle</text>
  <text x="890" y="679" text-anchor="middle" font-size="13" fill="#d9f2e3">unused modules are never required</text>

  <!-- Legend -->
  <g font-size="12.5" fill="#6b7280">
    <rect x="404" y="731" width="16" height="12" rx="3" fill="#fdecec" stroke="#d64545"/>
    <text x="426" y="741">bundled</text>
    <rect x="496" y="731" width="16" height="12" rx="3" fill="#e8f6ee" stroke="#2f9e5a"/>
    <text x="518" y="741">bundled (used)</text>
    <rect x="626" y="731" width="16" height="12" rx="3" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="3 2"/>
    <text x="648" y="741">not bundled</text>
  </g>
</svg>
